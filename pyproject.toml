[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerline"
version = "1.0.0"
description = "Audit-ready financial close commentary: reconcile, narrate, verify, sign."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["httpx2>=0.27"]

[tool.setuptools.packages.find]
include = ["app*", "tests*"]

[tool.setuptools.package-data]
app = ["static/*"]
